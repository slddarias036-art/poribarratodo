<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ibarra Civic Radar - Juan Arias</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Fonts para coincidir con la tipografía de campaña -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand-group">
      <div class="eyebrow">Monitor de conversación pública &amp; cobertura mediática · Ibarra</div>
      <h1>IBARRA CIVIC RADAR</h1>
      <div class="sub">Cobertura mediática y conversación pública sobre la candidatura de <strong>Juan Fernando Arias Carvajal</strong> para la Alcaldía de Ibarra.</div>
    </div>
    <div class="actions-group">
      <div class="btn-group">
        <button class="btn-primary" id="btnSyncOnline" onclick="syncOnlineCsv()">
          <span class="sync-icon">🔄</span> Actualizar los datos
        </button>
        <button class="btn-ghost" onclick="document.getElementById('csvInput').click()">Cargar local</button>
        <input type="file" id="csvInput" accept=".csv" style="display:none;">
      </div>
      <div class="meta-info">
        <div class="update-pill"><span class="dot"></span><span id="lastUpdate">Última actualización: listos para sincronizar</span></div>
        <div class="candidate-links">
          <a href="https://www.poribarratodo.com" target="_blank" rel="noopener">poribarratodo.com</a> · 
          <a href="https://twitter.com/juanariasec" target="_blank" rel="noopener">@juanariasec</a>
        </div>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="inicio">Inicio</button>
    <button class="tab" data-tab="tendencias">Tendencias</button>
    <button class="tab" data-tab="heatmap">Mapa de calor</button>
    <button class="tab" data-tab="instagram">Instagram</button>
    <button class="tab" data-tab="facebook">Facebook</button>
    <button class="tab" data-tab="tiktok">TikTok</button>
    <button class="tab" data-tab="noticias">Noticias</button>
    <button class="tab" data-tab="narrativas">Narrativas</button>
    <button class="tab" data-tab="verificacion">Verificación</button>
    <button class="tab" data-tab="datos">Datos</button>
    <button class="tab" data-tab="metodologia">Metodología</button>
  </div>
</div>

<main>

  <div class="filter-bar" id="globalFilterBar">
    <div class="field">
      <label class="f-label">Plataforma</label>
      <select id="platformFilter"><option value="">Todas las fuentes</option></select>
    </div>
    <div class="field">
      <label class="f-label">Fuente</label>
      <select id="f-fuente"><option value="">Todas</option></select>
    </div>
    <div class="field">
      <label class="f-label">Categoría / tema</label>
      <select id="f-categoria"><option value="">Todas</option></select>
    </div>
    <div class="field">
      <label class="f-label">Desde</label>
      <input type="date" id="f-desde">
    </div>
    <div class="field">
      <label class="f-label">Hasta</label>
      <input type="date" id="f-hasta">
    </div>
    <button class="reset-btn" id="reset">Limpiar filtros</button>
    <div class="nav-hint" id="filterCount" style="margin-left:auto;"></div>
  </div>

  <section id="content">
    <!-- Contenido dinámico (KPIs, gráficos, tablas) es responsabilidad de app.js y se activa con el evento csv-updated -->
  </section>
</main>

<!-- Scripts: app.js debe cargarse antes del cargador para que los hooks existan -->
<script src="app.js"></script>
<script src="data-loader.js"></script>
<script src="csv-hooks.js"></script>

</body>
</html>
